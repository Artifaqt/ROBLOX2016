name: Apply NAMEHERE rename
on:
  push:
    branches: [rename-roblox-to-namehere]
    paths: [.github/workflows/apply-namehere-rename.yml]
permissions:
  contents: write
jobs:
  rename:
    if: github.repository == 'justusguy421-hue/khjre'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and verify the prepared rename
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          
          WORKFLOW = '.github/workflows/apply-namehere-rename.yml'
          EXPECTED_TREE = 'd0859e10f88da5c133b3490bac8476442b91f3d4'
          PATTERN = re.compile(rb'roblox', re.I)
          TEXT_PATTERN = re.compile('roblox', re.I)
          
          
          def replacement(match):
              old = match.group()
              if isinstance(old, bytes):
                  return b'namehere' if old.islower() else b'NAMEHERE'
              return 'namehere' if old.islower() else 'NAMEHERE'
          
          
          def text_encoding(data):
              for bom, encoding in [(b'\xff\xfe\x00\x00', 'utf-32-le'),
                                    (b'\x00\x00\xfe\xff', 'utf-32-be'),
                                    (b'\xff\xfe', 'utf-16-le'),
                                    (b'\xfe\xff', 'utf-16-be')]:
                  if data.startswith(bom):
                      try:
                          data.decode(encoding)
                          return encoding
                      except UnicodeError:
                          return None
              if b'\x00' in data:
                  return None
              if data and sum(data.count(bytes([i])) for i in range(32)
                              if i not in (9, 10, 12, 13, 27)) / len(data) > 0.001:
                  return None
              return 'bytes'
          
          
          original = {}
          for record in subprocess.check_output(['git', 'ls-files', '--stage', '-z']).split(b'\0'):
              if record:
                  info, path = record.split(b'\t', 1)
                  mode, oid, stage = info.split()
                  original[os.fsdecode(path)] = (mode.decode(), oid.decode())
          assert WORKFLOW in original
          assert len(original) == 146650
          paths = [p for p in original if p != WORKFLOW]
          mapped = {p: TEXT_PATTERN.sub(replacement, p) for p in paths}
          assert len(set(mapped.values())) == len(paths)
          changed_paths = []
          count = 0
          for number, path in enumerate(paths):
              file = Path(path)
              before = os.readlink(file).encode() if file.is_symlink() else file.read_bytes()
              after = before
              # Files without a literal or BOM cannot contain a supported text match.
              if PATTERN.search(before) or before.startswith((b'\xff\xfe', b'\xfe\xff', b'\x00\x00\xfe\xff')):
                  encoding = text_encoding(before)
                  if encoding == 'bytes':
                      after, n = PATTERN.subn(replacement, before)
                      count += n
                  elif encoding:
                      text, n = TEXT_PATTERN.subn(replacement, before.decode(encoding))
                      after = text.encode(encoding)
                      count += n
              if after != before:
                  assert not file.is_symlink(), 'Unexpected modified symlink'
                  file.write_bytes(after)
                  changed_paths.append(path)
              if number % 20000 == 0:
                  print('Scanned', number, 'files', flush=True)
          assert len(changed_paths) == 2383
          assert count == 25854
          raw = subprocess.check_output(['git', 'hash-object', '-w', '--no-filters', '--stdin-paths'],
                                        input=('\n'.join(changed_paths) + '\n').encode())
          blobs = dict(zip(changed_paths, raw.decode().splitlines()))
          records = []
          for path in paths:
              destination = mapped[path]
              if destination != path or path in blobs:
                  mode, oid = original[path]
                  if destination != path:
                      records.append('0 ' + '0' * 40 + '\t' + path)
                  records.append(mode + ' ' + blobs.get(path, oid) + '\t' + destination)
          records.append('0 ' + '0' * 40 + '\t' + WORKFLOW)
          subprocess.run(['git', 'update-index', '-z', '--index-info'],
                         input=('\0'.join(records) + '\0').encode(), check=True)
          tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert tree == EXPECTED_TREE, ('Unexpected result tree', tree)
          print('Verified result tree:', tree, flush=True)
          # Keep the runner workflow unchanged during its push; remove it through the
          # connector after the run succeeds. The final source tree above excludes it.
          mode, oid = original[WORKFLOW]
          subprocess.run(['git', 'update-index', '--add', '--cacheinfo', mode, oid, WORKFLOW], check=True)
      - name: Save renamed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --quiet -m 'Rename references to NAMEHERE'
          git push origin HEAD:refs/heads/rename-roblox-to-namehere
